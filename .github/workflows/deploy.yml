# Unterricks – Deployment auf Cloudflare (Worker + D1 + R2 + Durable Objects, Daten in der EU).
# Optional: SETUP_CODE (schützt die einmalige Einrichtung des Lehrkraft-Zugangs).
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN (Berechtigungen: Konto → Workers Scripts: Bearbeiten, D1: Bearbeiten,
# Workers R2 Storage: Bearbeiten, Workers AI: Lesen; Zone/Benutzer: keine), optional CLOUDFLARE_ACCOUNT_ID.
# Ohne Token wird nur ein Hinweis ausgegeben. R2 muss im Cloudflare-Konto einmal aktiviert sein (Dashboard → R2 → Plan wählen).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Secrets prüfen
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment übersprungen::Das Secret CLOUDFLARE_API_TOKEN ist nicht gesetzt. Anleitung: README, Abschnitt Einrichtung."
          fi

  deploy:
    name: Auf Cloudflare veröffentlichen
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Seite bauen (dist/)
        run: npm run build

      - name: Konto-ID ermitteln
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$ACC" ]; then
            ACC=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
            if [ -z "$ACC" ]; then echo "::error::Konto-ID nicht ermittelbar. Bitte das Secret CLOUDFLARE_ACCOUNT_ID setzen."; exit 1; fi
          fi
          echo "::add-mask::$ACC"
          echo "CF_ACCOUNT=$ACC" >> "$GITHUB_ENV"

      - name: D1-Datenbank in der EU sicherstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: npx wrangler d1 info unterricks-db >/dev/null 2>&1 || npx wrangler d1 create unterricks-db --jurisdiction eu

      - name: R2-Ablage in der EU sicherstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          if npx wrangler r2 bucket info unterricks-files --jurisdiction eu >/dev/null 2>&1; then
            echo "R2-Ablage vorhanden."
          elif ! OUT=$(npx wrangler r2 bucket create unterricks-files --jurisdiction eu 2>&1); then
            echo "$OUT" | tail -5
            echo "::error title=R2 nicht verfügbar::Die Dateiablage konnte nicht angelegt werden. Meist ist R2 im Cloudflare-Konto noch nicht aktiviert (Dashboard → R2 Object Storage → Plan wählen; kostenlos bis 10 GB) oder dem Token fehlt „Workers R2 Storage: Bearbeiten“."
            exit 1
          fi

      - name: Worker veröffentlichen
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: npx wrangler deploy

      - name: SETTINGS_SECRET sicherstellen (signiert Links, verschlüsselt KI-Schlüssel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # Nie überschreiben: ein neues Secret macht gespeicherte KI-Schlüssel unlesbar
          if ! LIST=$(npx wrangler secret list --format json 2>&1); then
            echo "::error::Secret-Liste nicht abrufbar – bitte den Workflow erneut starten."; echo "$LIST" | tail -5; exit 1
          elif echo "$LIST" | grep -q '"SETTINGS_SECRET"'; then
            echo "SETTINGS_SECRET ist bereits gesetzt."
          else
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put SETTINGS_SECRET
          fi

      - name: Optional – Einrichtungscode für den Lehrkraft-Zugang übernehmen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          if [ -n "$SETUP_CODE" ]; then printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE; else echo "Kein SETUP_CODE gesetzt – die Ersteinrichtung ist offen, bis sie erledigt ist."; fi

      - name: Adresse ausgeben
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SUB=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty')
          echo "::notice title=Unterricks ist online::https://unterricks.${SUB:-<ihre-subdomain>}.workers.dev – bitte sofort öffnen, unten „Lehrkräfte“ wählen und den Lehrkraft-Zugang einrichten."
