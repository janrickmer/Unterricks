# Unterricks – Deployment auf Cloudflare (Worker + D1 + R2 + Durable Objects, Daten in der EU).
# Optional: SETUP_CODE (schützt die einmalige Einrichtung des Lehrkraft-Zugangs).
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN (Berechtigungen: Konto → Workers Scripts: Bearbeiten, D1: Bearbeiten,
# Workers R2 Storage: Bearbeiten, Workers AI: Lesen; Zone/Benutzer: keine), optional CLOUDFLARE_ACCOUNT_ID.
# Ohne Token wird nur ein Hinweis ausgegeben. R2 muss im Cloudflare-Konto einmal aktiviert sein (Dashboard → R2 → Plan wählen).
# Danach baut der Job „pages“ die Oberfläche für GitHub Pages (eigene Adresse, z. B. unterricks.janrickmer.de) – nur wenn im Repository
# unter Settings → Pages als Quelle „GitHub Actions“ gewählt ist; sonst nur ein Hinweis. Der Server bleibt der Worker.
name: Deploy

# Jeder Push auf den Arbeitsbranch (zugleich Standardbranch des Repositorys) veröffentlicht automatisch – die Unit-Tests
# laufen vorher und stoppen den Deploy bei einem Fehler. Von Hand weiterhin über „Run workflow“.
on:
  push:
    branches: [main, ccr-a0b9567a-04ain7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Secrets prüfen
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment übersprungen::Das Secret CLOUDFLARE_API_TOKEN ist nicht gesetzt. Anleitung: README, Abschnitt Einrichtung."
          fi

  deploy:
    name: Auf Cloudflare veröffentlichen
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      api: ${{ steps.address.outputs.api }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Seite bauen (dist/)
        run: npm run build

      - name: Konto-ID ermitteln
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$ACC" ]; then
            ACC=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
            if [ -z "$ACC" ]; then echo "::error::Konto-ID nicht ermittelbar. Bitte das Secret CLOUDFLARE_ACCOUNT_ID setzen."; exit 1; fi
          fi
          echo "::add-mask::$ACC"
          echo "CF_ACCOUNT=$ACC" >> "$GITHUB_ENV"

      - name: D1-Datenbank in der EU sicherstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler d1 info unterricks-db >/dev/null 2>&1 || npx wrangler d1 create unterricks-db --jurisdiction eu
          # ID der (EU-)Datenbank ausdrücklich eintragen, damit „wrangler deploy“ genau diese bindet und keine neue anlegt
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "unterricks-db") | .uuid' | head -1)
          if [ -z "$ID" ]; then echo "::error::Die Datenbank unterricks-db wurde nicht gefunden."; exit 1; fi
          sed -i "s/\"database_name\": \"unterricks-db\" }/\"database_name\": \"unterricks-db\", \"database_id\": \"$ID\" }/" wrangler.jsonc
          grep -q "\"database_id\": \"$ID\"" wrangler.jsonc || { echo "::error::database_id konnte nicht in wrangler.jsonc eingetragen werden."; exit 1; }

      - name: R2-Ablage in der EU sicherstellen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          if npx wrangler r2 bucket info unterricks-files --jurisdiction eu >/dev/null 2>&1; then
            echo "R2-Ablage vorhanden."
          elif ! OUT=$(npx wrangler r2 bucket create unterricks-files --jurisdiction eu 2>&1); then
            echo "$OUT" | tail -5
            echo "::error title=R2 nicht verfügbar::Die Dateiablage konnte nicht angelegt werden. Meist ist R2 im Cloudflare-Konto noch nicht aktiviert (Dashboard → R2 Object Storage → Plan wählen; kostenlos bis 10 GB) oder dem Token fehlt „Workers R2 Storage: Bearbeiten“."
            exit 1
          fi

      - name: Worker veröffentlichen
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: npx wrangler deploy

      - name: SETTINGS_SECRET sicherstellen (signiert Links, verschlüsselt KI-Schlüssel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # Nie überschreiben: ein neues Secret macht gespeicherte KI-Schlüssel unlesbar
          if ! LIST=$(npx wrangler secret list --format json 2>&1); then
            echo "::error::Secret-Liste nicht abrufbar – bitte den Workflow erneut starten."; echo "$LIST" | tail -5; exit 1
          elif echo "$LIST" | grep -q '"SETTINGS_SECRET"'; then
            echo "SETTINGS_SECRET ist bereits gesetzt."
          else
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put SETTINGS_SECRET
          fi

      - name: Optional – Einrichtungscode für den Lehrkraft-Zugang übernehmen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          if [ -n "$SETUP_CODE" ]; then printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE; else echo "Kein SETUP_CODE gesetzt – die Ersteinrichtung ist offen, bis sie erledigt ist."; fi

      - name: Adresse ausgeben
        id: address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SUB=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty')
          if [ -n "$SUB" ]; then echo "api=https://unterricks.$SUB.workers.dev" >> "$GITHUB_OUTPUT"; fi
          echo "::notice title=Worker veröffentlicht::https://unterricks.${SUB:-<ihre-subdomain>}.workers.dev (Server und Connector-Adresse). Nur beim allerersten Mal: Seite öffnen, unten „Lehrkräfte“ wählen und den Lehrkraft-Zugang einrichten."

  pages:
    name: Oberfläche auf GitHub Pages veröffentlichen
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Ist GitHub Pages eingerichtet?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TYPE=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || true)
          if [ "$TYPE" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages übersprungen::Im Repository ist GitHub Pages nicht mit der Quelle „GitHub Actions“ eingerichtet (Settings → Pages → Build and deployment → Source). Die Oberfläche bleibt über die Worker-Adresse erreichbar."
          fi

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.enabled == 'true'
        run: npm ci

      - name: Seite für GitHub Pages bauen (dist-pages/, Server = Worker)
        if: steps.check.outputs.enabled == 'true'
        env:
          PAGES_API: ${{ needs.deploy.outputs.api }}
        run: |
          if [ -z "$PAGES_API" ]; then echo "::error::Die Adresse des Workers ist unbekannt (workers.dev-Subdomain nicht ermittelbar)."; exit 1; fi
          npm run build

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

      - id: publish
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
